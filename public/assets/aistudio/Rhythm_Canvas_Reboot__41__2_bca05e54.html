const generateBeatmap = (bpm, startSeconds, lengthSeconds, difficultyStr, gameMode = 'standard') => {
  const notes = []; const bps = bpm / 60; const beatDur = 1000 / bps;
  let diffMult = difficultyStr === 'normal' ? 2 : difficultyStr === 'hard' ? 4 : difficultyStr === 'insane' ? 8 : 1;
  const isVS = gameMode === 'online_vs';
 
  for (let beat = Math.floor(startSeconds * bps); beat < Math.floor((startSeconds + lengthSeconds) * bps); beat++) {
    for (let sub = 0; sub < diffMult; sub++) {
      if (Math.random() > 0.4 + (diffMult * 0.05)) {
        const time = (beat * beatDur) + (sub * (beatDur / diffMult));
        let numNotes = Math.random() > 0.8 ? Math.floor(Math.random() * (difficultyStr === 'normal' ? 2 : difficultyStr === 'hard' ? 3 : 4)) + 1 : 1;
       
        let availableLanes = [0, 1, 2, 3];
        for (let i = 0; i < numNotes; i++) {
          if (availableLanes.length === 0) break;
          const lane = availableLanes.splice(Math.floor(Math.random() * availableLanes.length), 1)[0];
          const isDemon = Math.random() > 0.92;
         
          if (isVS) {
             notes.push({ time, lane: lane, hit: false, missed: false, isBot: true, type: 'normal' });
             notes.push({ time, lane: lane + 4, hit: false, missed: false, isBot: false, type: isDemon ? 'demon' : 'normal' });
          } else {
             notes.push({ time, lane, hit: false, missed: false, isBot: false, type: isDemon ? 'demon' : 'normal' });
          }
        }
      }
    }
  }
  return notes.sort((a, b) => a.time - b.time);
};

const getDurationString = (song) => {
    if (!song) return "0:00";
    let durationMs = 180000;
    if (song.customMap) {
        durationMs = song.customMap.length > 0 ? song.customMap[song.customMap.length - 1].time + 2500 : 0;
    }
    const totalSeconds = Math.ceil(durationMs / 1000);
    const mins = Math.floor(totalSeconds / 60);
    const secs = totalSeconds % 60;
    return `${mins}:${secs.toString().padStart(2, '0')}`;
};

      while (newXp >= xpNeeded) { newXp -= xpNeeded; newLevel++; xpNeeded = getXpRequirement(newLevel); }
      const newData = { ...prev, xp: newXp, level: newLevel, coins: newCoins };

      peer.on('disconnected', () => {

function OnlineLobby({ peer, myPeerId, setNetworkConnection, setScreen, gameMode }) {
    const [joinCode, setJoinCode] = useState('');
    const [status, setStatus] = useState('Initializing network...');
 
    // Host: Listen for incoming connections
    useEffect(() => {
        if (!peer) return;
        
        if (myPeerId) {
            setStatus('Waiting for opponent to connect...');
        } else {
            setStatus('GENERATING CODE...');
        }

        const handleConnection = (conn) => {conn._rhythmRole='host';setStatus('Opponent connected. Synchronizing...');const launch=()=>{setNetworkConnection(conn);setStatus('Opponent Connected! Starting Game...');setTimeout(()=>setScreen(gameMode==='horse'?'horse':'game'),800);};if(conn.open)launch();else conn.on('open',launch);};
        
        const handlePeerError = (err) => {
            if (err.type === 'peer-unavailable') {
                setStatus('Connection Failed. Code not found.');
            } else if (err.type === 'network') {
                setStatus('Network connection error.');
            } else {
                setStatus('Error: ' + err.type);
            }
        };

        peer.on('connection', handleConnection);
        peer.on('error', handlePeerError);
        
        return () => {
            peer.off('connection', handleConnection);
            peer.off('error', handlePeerError);
        };
    }, [peer, myPeerId, setScreen, gameMode]);
 
    // Guest: Connect to Host
    const handleJoin = () => {
        if (!joinCode || !peer) return;
        setStatus('Connecting to Host...');
        
        // Remove spaces that might have been copied
        const safeJoinCode = joinCode.trim();
        const conn = peer.connect(safeJoinCode, { reliable: true });
        conn._rhythmRole='guest';
       
        conn.on('open', () => {
            setStatus('Connected to Host! Starting Game...');
            setNetworkConnection(conn);
            setTimeout(() => {
                setScreen(gameMode === 'horse' ? 'horse' : 'game');
            }, 2000);
        });
 
        conn.on('error', (err) => {
            setStatus('Connection Failed. Try again.');
        });
    };
 
    return (
        <div className="w-full h-full flex flex-col items-center justify-center bg-indigo-950 p-4 md:p-12 overflow-y-auto">
            <div className="w-full flex justify-start mb-8">

function HorseEngine({ networkConnection, setScreen, playerInfo }) {
    const canvasRef = useRef(null);
    const [phase, setPhase] = useState('waiting');
    const [isHost, setIsHost] = useState(false);
    const [score, setScore] = useState(0);
    const recordedNotes = useRef([]);
    const startTime = useRef(0);
    const reqRef = useRef();
   
  const currentSkinColors = playerInfo.equippedSkin === 'custom'
        ? playerInfo.customColors
        : (SKINS[playerInfo.equippedSkin]?.colors || SKINS.default.colors);
    const currentSkinShape = playerInfo.equippedShape || 'arrow';
 
    useEffect(() => {
        if(!networkConnection){setPhase('error');return;}
        const iAmHost = networkConnection._rhythmRole==='host';
        setIsHost(iAmHost);
        setPhase(iAmHost ? 'recording' : 'waiting');
        startTime.current = performance.now();
 
        const onData=(data) => {
            if (data.type === 'horse_pattern') {
                recordedNotes.current = data.notes.map(n => ({...n, hit: false, missed: false, type: n.type || 'normal'}));
                setPhase('playing');
                startTime.current = performance.now();
            } else if (data.type === 'horse_score') {
                setScore(data.score);
                setPhase('finished');
            }
        };networkConnection.on('data',onData);return()=>networkConnection.off?.('data',onData);
    }, [networkConnection]);
 
    useEffect(() => {
        const handleKey = (e) => {
            if(e.repeat)return;
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "Tab", "Enter", "Backspace"].includes(e.key) || e.altKey || e.ctrlKey) {
                e.preventDefault();
            }
 
            const lane = KEY_MAP[e.key.toLowerCase()];
            if (lane === undefined) return;
            const now = performance.now();
            const elapsed = now - startTime.current;
 
            if (phase === 'recording') {
                AudioEngine.playHitSound();
                recordedNotes.current.push({ time: elapsed, lane, hit: false, missed: false, type: 'normal' });
            } else if (phase === 'playing') {
                const targetNote = recordedNotes.current.find(n => n.lane === lane && !n.hit && !n.missed && Math.abs(n.time - elapsed) < HIT_WINDOWS.miss);
                if (targetNote) {
                    targetNote.hit = true;
                    setScore(s => s + 350);
                    AudioEngine.playHitSound();
                }
            }
        };
        window.addEventListener('keydown', handleKey, { passive: false });
        return () => window.removeEventListener('keydown', handleKey);
    }, [phase]);
 
    useEffect(() => {
        const ctx = canvasRef.current?.getContext('2d');
        if (!ctx) return;
       
        const loop = (time) => {
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            const elapsed = time - startTime.current;
           
            for (let i = 0; i < 4; i++) {
                drawNote(ctx, 20 + i * LANE_WIDTH, 100, 60, i % 4, null, false, currentSkinShape);
            }
 
            if (phase === 'recording') {
                if (elapsed > 10000) {
                    if(networkConnection?.open)networkConnection.send({ type: 'horse_pattern', notes: recordedNotes.current });
                    setPhase('waiting_for_result');
                    return;
                }
            } else if (phase === 'playing') {
                let activeNotes = false;
                recordedNotes.current.forEach(n => {
                    if (!n.hit && !n.missed) {
                        activeNotes = true;
                        const y = 100 + (n.time - elapsed) * 0.6;
                        if (y > -100 && y < CANVAS_HEIGHT + 100) {
                            drawNote(ctx, 20 + n.lane * LANE_WIDTH, y, 60, n.lane % 4, currentSkinColors[n.lane % 4], false, currentSkinShape, n.type);
                        }
                        if (elapsed > n.time + HIT_WINDOWS.miss) n.missed = true;
                    }
                });
               
                if (!activeNotes && elapsed > (recordedNotes.current[recordedNotes.current.length-1]?.time || 0) + 2000) {
                    if(networkConnection?.open)networkConnection.send({ type: 'horse_score', score });
                    setPhase('finished');
                    return;
                }
            }
            reqRef.current = requestAnimationFrame(loop);
        };
        reqRef.current = requestAnimationFrame(loop);
        return () => cancelAnimationFrame(reqRef.current);
    }, [phase, score, currentSkinColors, currentSkinShape]);
 
    return (
        <div className="w-full h-full flex flex-col items-center justify-center bg-gray-900 transition-colors overflow-hidden">
            <div className="absolute top-12 text-center z-10 bg-black p-4 md:p-6 border-4 border-white shadow-[8px_8px_0_#fff] transform skew-x-[-5deg] w-11/12 max-w-2xl">

                </h2>
                {(phase === 'playing' || phase === 'finished') && (

}

function InterruptionAdminPanel({ interruption }) {
  const [message, setMessage] = useState('Gameplay is temporarily paused. Please wait for the administrator to resume.');
  const [status, setStatus] = useState('');

  const issue = async () => {
    if (!isAdmin || !db) { setStatus('Admin access or database unavailable.'); return; }
    try {
      await db.collection('system').doc('interruption').set({
        active: true,
        message: message.trim() || 'Gameplay is temporarily paused.',
        issuedBy: auth.currentUser.uid,
        issuedAt: Date.now()
      });
      setStatus('Interruption issued to connected players.');
    } catch (error) {
      setStatus(`Could not issue interruption: ${error.message}`);
    }
  };

  const stop = async () => {
    if (!isAdmin || !db) { setStatus('Admin access or database unavailable.'); return; }
    try {
      await db.collection('system').doc('interruption').set({ active: false, stoppedAt: Date.now() }, { merge: true });
      setStatus('Interruption stopped.');
    } catch (error) {
      setStatus(`Could not stop interruption: ${error.message}`);
    }
  };

  return (
    <div className="w-full max-w-2xl bg-black border-4 border-red-500 p-4 shadow-[6px_6px_0_#000]">
      <h3 className="text-xl font-black text-red-300">GLOBAL GAME INTERRUPTION {interruption?.active ? '• ACTIVE' : '• INACTIVE'}</h3>

      <div className="flex flex-wrap gap-3 mt-3">

        <button onClick={stop} disabled={!interruption?.active} className="bg-green-400 text-black px-4 py-2 font-black disabled:opacity-40">STOP INTERRUPTION</button>

      {status && <p className="mt-2 text-sm text-cyan-200">{status}</p>}

  );
}

  const localSongs = songs.filter(s => s.artist === 'Royalty Free' || s.artist === 'USER');

      displayedSongs = rhythmList
          .map(id => songs.find(s => String(s.id) === String(id)))
          .filter(Boolean);
  }
 
  useEffect(() => {
      if (displayedSongs.length > 0 && !displayedSongs.find(s => s.id === selectedSong?.id)) {
          setSelectedSong(displayedSongs[0]);
      }
  }, [displayedSongs, selectedSong, setSelectedSong]);
 
  useEffect(() => {
      if (!selectedSong || !selectedSong.audioUrl) {
          setIsPreviewing(false);
          if (previewAudioRef.current) {
              previewAudioRef.current.pause();
              previewAudioRef.current.src = '';
          }
          return;
      }
 
      setIsPreviewing(true);
 
      if (previewAudioRef.current) {
          previewAudioRef.current.pause();
          previewAudioRef.current.src = '';
      }
 
      const audio = new Audio(selectedSong.audioUrl);
      audio.volume = 0; audio.playbackRate = modifiers?.speed || 1; audio.preservesPitch = false;
      previewAudioRef.current = audio;
      const detachPulse = selectedSong.coverUrl ? WaveformPulse.attach(audio, `[data-wave-cover="${String(selectedSong.id)}"]`) : ()=>{};
 
      let fadeInInterval, fadeOutInterval, stopTimeout;
      let isCancelled = false;
 
      audio.play().then(() => {
          if (isCancelled) { audio.pause(); return; }
          let vol = 0;
          fadeInInterval = setInterval(() => {
              if (vol < 0.4) {
                  vol += 0.05;
                  audio.volume = Math.min(vol, 0.4);
              } else { clearInterval(fadeInInterval); }
          }, 100);
 
          stopTimeout = setTimeout(() => {
              let fadeOutVol = audio.volume;
              fadeOutInterval = setInterval(() => {
                  if (fadeOutVol > 0.05) {
                      fadeOutVol -= 0.05;
                      audio.volume = Math.max(fadeOutVol, 0);
                  } else {
                      clearInterval(fadeOutInterval);
                      audio.pause();
                      if (!isCancelled) setIsPreviewing(false);
                  }
              }, 100);
          }, 10000);
 
      }).catch(() => {
          if (!isCancelled) setIsPreviewing(false);
      });
 
      return () => {
          isCancelled = true;
          clearInterval(fadeInInterval);
          clearInterval(fadeOutInterval);
          clearTimeout(stopTimeout);
          if (previewAudioRef.current) {
              previewAudioRef.current.pause();
              previewAudioRef.current.src = '';
          }
          detachPulse();
          setIsPreviewing(false);
      };
  }, [selectedSong, setIsPreviewing, modifiers?.speed]);

  const cycleMode = (dir) => { let nextIdx = modes.findIndex(m => m.id === gameMode) + dir; if (nextIdx < 0) nextIdx = modes.length - 1; if (nextIdx >= modes.length) nextIdx = 0; setGameMode(modes[nextIdx].id); };

function OnlineTracksMenu({ songs, setSongs, selectedSong, setSelectedSong, difficulty, setDifficulty, gameMode, setGameMode, setScreen, setCustomBeatmap, user, setIsPreviewing, playerInfo, setPlayerInfo, modifiers, setModifiers, bestGrades }) {

  const [searchTerm, setSearchTerm] = useState('');
  const previewAudioRef = useRef(null);
 
  const onlineSongs = songs.filter(s => s.artist !== 'Royalty Free' && s.artist !== 'USER');
  const filteredSongs = onlineSongs.filter(s =>
      s.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
      s.artist.toLowerCase().includes(searchTerm.toLowerCase())
  );
 
  useEffect(() => {
      if (filteredSongs.length > 0 && !filteredSongs.find(s => s.id === selectedSong?.id)) {
          setSelectedSong(filteredSongs[0]);
      } else if (filteredSongs.length === 0) {
          setSelectedSong(null);
      }
  }, [filteredSongs, selectedSong, setSelectedSong]);
 
  useEffect(() => {
      if (!selectedSong || !selectedSong.audioUrl) {
          setIsPreviewing(false);
          if (previewAudioRef.current) {
              previewAudioRef.current.pause();
              previewAudioRef.current.src = '';
          }
          return;
      }
 
      setIsPreviewing(true);
 
      if (previewAudioRef.current) {
          previewAudioRef.current.pause();
          previewAudioRef.current.src = '';
      }
 
      const audio = new Audio(selectedSong.audioUrl);
      audio.volume = 0; audio.playbackRate = modifiers?.speed || 1; audio.preservesPitch = false;
      previewAudioRef.current = audio;
      const detachPulse = selectedSong.coverUrl ? WaveformPulse.attach(audio, `[data-wave-cover="${String(selectedSong.id)}"]`) : ()=>{};
 
      let fadeInInterval, fadeOutInterval, stopTimeout;
      let isCancelled = false; 
 
      audio.play().then(() => {
          if (isCancelled) {
              audio.pause();
              return;
          }
          let vol = 0;
          fadeInInterval = setInterval(() => {
              if (vol < 0.4) {
                  vol += 0.05;
                  audio.volume = Math.min(vol, 0.4);
              } else { clearInterval(fadeInInterval); }
          }, 100);
 
          stopTimeout = setTimeout(() => {
              let fadeOutVol = audio.volume;
              fadeOutInterval = setInterval(() => {
                  if (fadeOutVol > 0.05) {
                      fadeOutVol -= 0.05;
                      audio.volume = Math.max(fadeOutVol, 0);
                  } else {
                      clearInterval(fadeOutInterval);
                      audio.pause();
                      if (!isCancelled) setIsPreviewing(false);
                  }
              }, 100);
          }, 10000);
 
      }).catch(() => {
          if (!isCancelled) setIsPreviewing(false);
      });
 
      return () => {
          isCancelled = true;
          clearInterval(fadeInInterval);
          clearInterval(fadeOutInterval);
          clearTimeout(stopTimeout);
          if (previewAudioRef.current) {
              previewAudioRef.current.pause();
              previewAudioRef.current.src = '';
          }
          detachPulse();
          setIsPreviewing(false);
      };
  }, [selectedSong, modifiers?.speed]);
 
  const cycleDiff = (dir) => { let nextIdx = diffs.indexOf(difficulty) + dir; if (nextIdx < 0) nextIdx = diffs.length - 1; if (nextIdx >= diffs.length) nextIdx = 0; setDifficulty(diffs[nextIdx]); };
  const cycleMode = (dir) => { let nextIdx = modes.findIndex(m => m.id === gameMode) + dir; if (nextIdx < 0) nextIdx = modes.length - 1; if (nextIdx >= modes.length) nextIdx = 0; setGameMode(modes[nextIdx].id); };
 
  const handlePlayClick = () => {
      if (!selectedSong) return;
      if (modifiers.extreme && (bestGrades[String(selectedSong.id)]||0) < 90) setModifiers(m=>({...m,extreme:false}));
      setCustomBeatmap(Array.isArray(selectedSong.customMap) ? normalizeChart(selectedSong.customMap).map(n=>({...n})) : null);

  const updatePublishedCover = async (patch) => {

  };
  const uploadPublishedCover = async e => {
      const file=e.target.files?.[0]; if(!file) return;
      if(file.size > 8000000){ alert('Please use an image smaller than 8 MB.'); return; }
      const songAtUpload={...selectedSong};
      const readDataUrl=()=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});
      try {
        // Apply a local preview first. This immediately activates the cover layout while uploading.
        const localUrl=await readDataUrl();
        const optimistic={...songAtUpload,coverUrl:localUrl,coverPulse:true,coverPulseBpm:songAtUpload.coverPulseBpm||1,coverPulseSubdivision:songAtUpload.coverPulseSubdivision||1};
        setSelectedSong(optimistic); setSongs(prev=>prev.map(x=>String(x.id)===String(optimistic.id)?optimistic:x));
        let publicUrl=localUrl;
        if(storage && user){
          try {
            const path=`covers/${user.uid}/${songAtUpload.id}_${Date.now()}_${file.name.replace(/[^a-z0-9._-]/gi,'_')}`;
            const snap=await storage.ref().child(path).put(file,{contentType:file.type||'image/jpeg'});
            publicUrl=await snap.ref.getDownloadURL();
          } catch(storageError) {
            // Legacy projects may have restrictive Storage rules. Small covers still persist in Firestore.
            if(localUrl.length>750000) throw new Error('Firebase Storage rejected the upload and this image is too large for the database. Try an image under 500 KB. '+storageError.message);
            console.warn('Storage unavailable; using database image fallback.',storageError);
          }
        }
        // Write against the original song ID, even if the live listener changed selection mid-upload.
        const patch={coverUrl:publicUrl,coverPulse:true,coverPulseBpm:songAtUpload.coverPulseBpm||1,coverPulseSubdivision:songAtUpload.coverPulseSubdivision||1,coverUpdatedAt:Date.now(),ownerUid:songAtUpload.ownerUid||user.uid};
        await db.collection('community_tracks').doc(String(songAtUpload.id)).set(patch,{merge:true});
        const finished={...optimistic,...patch}; setSelectedSong(cur=>String(cur?.id)===String(finished.id)?finished:cur); setSongs(prev=>prev.map(x=>String(x.id)===String(finished.id)?finished:x));
      } catch(err){
        setSelectedSong(songAtUpload); setSongs(prev=>prev.map(x=>String(x.id)===String(songAtUpload.id)?songAtUpload:x));

const getDurationString = (song) => {

                    )}
                    {songs.filter(s => s.artist === 'USER').map(song => (
                        <button key={song.id} onClick={() => handleLoad(song)} className="w-full text-left p-4 border-4 border-black bg-gray-200 hover:bg-blue-300 transition-colors shadow-[4px_4px_0_#000] flex justify-between items-center group active:translate-y-1 active:shadow-none">
                            <span className="font-black text-2xl uppercase text-black">{song.title}</span>
                            <span className="font-bold text-gray-700 bg-white px-3 py-1 border-2 border-black">{song.bpm} BPM</span>
                        </button>
                    ))}
 
                    {/* --- COMMUNITY TRACKS --- */}
                    <h3 className="text-2xl font-black bg-cyan-400 text-black p-2 mt-4 text-center border-4 border-black">COMMUNITY TRACKS (REMIX)</h3>
                    {songs.filter(s => s.artist !== 'USER' && s.artist !== 'Royalty Free').length === 0 && (
                        <div className="text-xl font-bold text-gray-600 text-center bg-gray-200 p-6 border-4 border-black">No community tracks downloaded.</div>
                    )}
                    {songs.filter(s => s.artist !== 'USER' && s.artist !== 'Royalty Free').map(song => (
                        <button key={song.id} onClick={() => handleLoad(song)} className="w-full text-left p-4 border-4 border-black bg-cyan-100 hover:bg-cyan-300 transition-colors shadow-[4px_4px_0_#000] flex justify-between items-center group active:translate-y-1 active:shadow-none">
                            <span className="font-black text-2xl uppercase text-black truncate pr-4">{song.title}</span>
                            <span className="font-bold text-gray-700 bg-white px-3 py-1 border-2 border-black whitespace-nowrap">{song.bpm} BPM</span>
                        </button>
                    ))}
 
                    {/* --- DEFAULT TRACKS --- */}
                    <h3 className="text-2xl font-black bg-pink-500 text-black p-2 mt-4 text-center border-4 border-black">DEFAULT TRACKS (REMIX)</h3>
                    {songs.filter(s => s.artist === 'Royalty Free').map(song => (
                        <button key={song.id} onClick={() => handleLoad(song)} className="w-full text-left p-4 border-4 border-black bg-pink-100 hover:bg-pink-300 transition-colors shadow-[4px_4px_0_#000] flex justify-between items-center group active:translate-y-1 active:shadow-none">
                            <span className="font-black text-2xl uppercase text-black truncate pr-4">{song.title}</span>
                            <span className="font-bold text-gray-700 bg-white px-3 py-1 border-2 border-black whitespace-nowrap">{song.bpm} BPM</span>
                        </button>
                    ))}
 
                </div>
 
                <button onClick={() => setShowLoadModal(false)} className="mt-6 w-full py-3 font-black text-2xl bg-red-500 border-4 border-black text-white hover:bg-red-400 transition-all shadow-[4px_4px_0_#000] active:translate-y-1 active:shadow-none transform skew-x-[5deg]">
                    CANCEL
                </button>
            </div>
        </div>
      )}
    </div>
  );
}
 
class RebootErrorBoundary extends React.Component {
  constructor(props){super(props);this.state={error:null};}
  static getDerivedStateFromError(error){return {error};}
  componentDidCatch(error,info){console.error('Rhythm Canvas Reboot error',error,info);}
  render(){if(this.state.error)return <div style={{minHeight:'100vh',background:'#090a10',color:'white',padding:'40px',fontFamily:'Saira,sans-serif'}}><h1 style={{color:'#ffd21b',fontSize:'42px',fontWeight:900}}>REBOOT RECOVERY</h1><p>The game recovered from a loading error.</p><pre style={{whiteSpace:'pre-wrap',background:'#151720',padding:'16px',border:'2px solid #ef4444'}}>{String(this.state.error?.message||this.state.error)}</pre><button onClick={()=>{localStorage.removeItem('rhythmCanvasLocalSongs');location.reload()}} style={{padding:'14px 22px',marginTop:'16px',background:'#ec4899',fontWeight:900}}>CLEAR DAMAGED LOCAL TRACKS & RELOAD</button></div>;return this.props.children;}
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<RebootErrorBoundary><App /></RebootErrorBoundary>);
    </script>
</body>
</html>
