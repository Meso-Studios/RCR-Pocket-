<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#070812" />
    <title>Rhythm Canvas Reboot</title>
    <meta name="description" content="Mobile-optimized HTML5 4-lane rhythm game with touch controls, freeplay tracks, battle royale, H.O.R.S.E. multiplayer, custom note shop, and song chart editor." />
    <meta property="og:title" content="Rhythm Canvas Reboot" />
    <meta property="og:description" content="Mobile-optimized HTML5 4-lane rhythm game with touch controls, freeplay tracks, battle royale, H.O.R.S.E. multiplayer, custom note shop, and song chart editor." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070812'/%3E%3Cpolygon points='32,10 54,32 42,32 42,54 22,54 22,32 10,32' fill='%2322d3ee' stroke='%23ff3cac' stroke-width='4'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet" />
    <script async src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  </head>
  <body style="margin:0;background:#05060d;color:#fff;font-family:'Saira',system-ui,sans-serif;">
    <div id="root">
      <div id="rc-boot-fallback" style="display:none;min-height:100vh;padding:24px;box-sizing:border-box;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#070812;color:#fff;">
        <h1 style="margin:0 0 12px;font-size:28px;font-weight:900;color:#facc15;">RHYTHM CANVAS REBOOT</h1>
        <p id="rc-boot-reason" style="max-width:560px;margin:0 0 16px;font-size:15px;line-height:1.5;color:#cbd5e1;">
          The app could not initialize. Please reload the page or check your browser console for details.
        </p>
        <button type="button" onclick="window.location.reload()" style="padding:10px 20px;font-weight:800;background:#22d3ee;color:#000;border:2px solid #000;cursor:pointer;">
          RELOAD PAGE
        </button>
      </div>
    </div>
    <script>
      (function () {
        var timer = setTimeout(function () {
          var fb = document.getElementById('rc-boot-fallback');
          if (fb) fb.style.display = 'flex';
        }, 4500);
        window.addEventListener('error', function (ev) {
          var fb = document.getElementById('rc-boot-fallback');
          var reason = document.getElementById('rc-boot-reason');
          if (fb && ev && ev.message) {
            clearTimeout(timer);
            fb.style.display = 'flex';
            if (reason) reason.textContent = 'Startup error: ' + ev.message;
          }
        });
      })();
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <script type="module" src="/src/main.tsx" onerror="var fb=document.getElementById('rc-boot-fallback');if(fb){fb.style.display='flex';}"></script>
  </body>
</html>
